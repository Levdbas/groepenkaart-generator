name: Deploy naar beta

on:
  push:
    branches: [beta]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beta-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: beta
      url: https://beta.groepenkaart-generator.nl
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run build

      - name: Rsync dist naar server
        uses: burnett01/rsync-deployments@v9
        with:
          switches: -avzr --delete
          path: dist/
          remote_path: "./files"
          remote_host: beta.groepenkaart-generator.nl
          remote_user: ${{ secrets.BETA_SSH_USER }}
          remote_key: ${{ secrets.BETA_SSH_KEY }}
