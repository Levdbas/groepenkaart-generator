name: Functie aanvragen
description: Stel een nieuwe functie of verbetering voor.
labels: ["enhancement"]
body:
  - type: dropdown
    id: version
    attributes:
      label: Versie
      description: Gaat je voorstel over de live of de beta versie van de app?
      options:
        - Live
        - Beta
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Wat wil je kunnen?
      description: Beschrijf het probleem of de behoefte en de functie die je graag zou zien.
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Aanvullende informatie (optioneel)
      description: Voorbeelden, schermafbeeldingen of een voorbeeldkaart (JSON-export). Anonimiseer de JSON eerst met de [anonimiseerpagina](https://levdbas.github.io/groepenkaart-generator/anonimiseren.html). Let op - meldingen en bijlagen zijn openbaar, gebruik geen persoonlijke gegevens.
