name: Bug melden
description: Meld een fout in de Groepenkaart generator.
labels: ["bug"]
body:
  - type: dropdown
    id: version
    attributes:
      label: Versie
      description: Op welke versie van de app doet de fout zich voor?
      options:
        - Live
        - Beta
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Wat gaat er mis?
      description: Beschrijf de fout en wat je verwachtte. Vermeld eventueel je browser.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Stappen om de fout te reproduceren
      value: |
        1.
        2.
        3.
  - type: textarea
    id: json
    attributes:
      label: JSON-bestand (optioneel)
      description: |
        Klik in de app op **Exporteren** en sleep `groepenkaart.json` naar dit veld. Accepteert GitHub het bestand niet, voeg het dan toe als `.zip`.

        **Let op: deze melding en de bijlagen zijn openbaar.** Vervang herkenbare namen, omschrijvingen en andere persoonlijke gegevens in een kopie van het bestand door fictieve gegevens.
