name: Bug melden
description: Meld een fout in de Groepenkaart generator.
labels: ["bug"]
body:
  - type: dropdown
    id: version
    attributes:
      label: Versie
      description: Op welke versie van de app doet de fout zich voor?
      options:
        - Live
        - Beta
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Wat gaat er mis?
      description: Beschrijf de fout en wat je verwachtte. Vermeld eventueel je browser.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Stappen om de fout te reproduceren
      value: |
        1.
        2.
        3.
  - type: textarea
    id: json
    attributes:
      label: JSON-bestand (optioneel)
      description: |
        Klik in de app op **Exporteren** en anonimiseer het bestand met de [anonimiseerpagina](https://levdbas.github.io/groepenkaart-generator/anonimiseren.html). Sleep daarna het geanonimiseerde bestand naar dit veld. Accepteert GitHub het bestand niet, voeg het dan toe als `.zip`.

        **Let op: deze melding en de bijlagen zijn openbaar.** De pagina maakt omschrijvingen, namen en gegevens van de netbeheerder onherkenbaar in je browser; controleer het resultaat zelf voordat je het uploadt.
