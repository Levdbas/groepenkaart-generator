<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Groepenkaart generator</title>
    <meta
      name="description"
      content="Maak gratis je eigen groepenkaart voor de meterkast. Voeg kasten en groepen toe en download de groepenindeling als PDF."
    />
    <meta name="theme-color" content="#003f7d" />

    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />

    <!-- Share previews need absolute URLs -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="nl_NL" />
    <meta property="og:site_name" content="Groepenkaart generator" />
    <meta property="og:title" content="Groepenkaart generator" />
    <meta
      property="og:description"
      content="Maak gratis je eigen groepenkaart voor de meterkast en download deze als PDF."
    />
    <meta
      property="og:url"
      content="https://levdbas.github.io/groepenkaart-generator/"
    />
    <meta
      property="og:image"
      content="https://levdbas.github.io/groepenkaart-generator/og-image.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Groepenkaart generator: maak je eigen groepenkaart en download als PDF"
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="app-header no-print">
      <div>
        <h1>Groepenkaart generator</h1>
        <p>Maak een groepenkaart voor je meterkast en download deze als PDF.</p>
      </div>
      <a
        class="github-link"
        href="https://github.com/levdbas/groepenkaart-generator"
        target="_blank"
        rel="noopener noreferrer"
        title="Bekijk op GitHub"
        aria-label="Bekijk de broncode op GitHub"
      >
        <svg
          viewBox="0 0 16 16"
          width="28"
          height="28"
          aria-hidden="true"
          fill="currentColor"
        >
          <path
            d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"
          ></path>
        </svg>
      </a>
    </header>

    <nav class="toolbar no-print" aria-label="Acties">
      <button type="button" id="add-box" class="btn btn-primary">
        + Kast toevoegen
      </button>
      <button type="button" id="download-pdf" class="btn">
        PDF downloaden
      </button>
      <button type="button" id="print" class="btn">Afdrukken</button>
      <span class="toolbar-spacer"></span>
      <button type="button" id="export-json" class="btn">Exporteren</button>
      <label class="btn" for="import-json">Importeren</label>
      <input
        type="file"
        id="import-json"
        accept="application/json,.json"
        hidden
      />
      <button type="button" id="clear-all" class="btn btn-danger">
        Alles wissen
      </button>
    </nav>

    <main id="boxes" class="boxes no-print"></main>

    <p id="empty-state" class="empty-state no-print" hidden>
      Nog geen kasten. Klik op <strong>+ Kast toevoegen</strong> om te beginnen.
    </p>

    <section id="print-area" class="print-area" aria-hidden="true"></section>

    <script src="vendor/jspdf.umd.min.js" defer></script>
    <script src="vendor/jspdf.plugin.autotable.min.js" defer></script>
    <script src="js/pdf.js" defer></script>
    <script src="js/app.js" defer></script>
  </body>
</html>
